<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MicroLearn | Microprocessor Portal</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .container {
            width: 90%;
            max-width: 900px;
            text-align: center;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 50px;
        }

        .logo span {
            color: #60a5fa;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .subtitle {
            font-size: 18px;
            color: #cbd5e1;
            margin-bottom: 40px;
        }

        .card {
            background: white;
            color: #1e293b;
            padding: 35px;
            border-radius: 20px;
            max-width: 500px;
            margin: auto;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        .card h2 {
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .info {
            margin-top: 25px;
            font-size: 14px;
            color: #64748b;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">
            MICRO<span>LEARN</span>
        </div>

        <h1>Microprocessor Learning Portal</h1>

        <p class="subtitle">
            Learn • Test Your Knowledge • Earn Your Certificate
        </p>

        <div class="card">

            <h2>Start Your Assignment</h2>

            <form action="/start" method="POST">

                <input
                    type="text"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >

                <input
                    type="text"
                    name="register_no"
                    placeholder="Enter your register number"
                    required
                >

                <label for="section">Select Your Section</label>

                <select id="section" name="section" required>
                    <option value="">Choose Section</option>
                    <option value="A">Section A</option>
                    <option value="B">Section B</option>
                    <option value="C">Section C</option>
                    <option value="D">Section D</option>
                    <option value="E">Section E</option>
                </select>

                <button type="submit">
                    Start Learning →
                </button>

            </form>

            <p class="info">
                Watch the Microprocessor lecture and complete the quiz
                to receive your certificate.
            </p>

        </div>

    </div>

</body>

</html>
